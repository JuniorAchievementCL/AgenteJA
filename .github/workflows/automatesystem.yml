name: Monitoreo Semanal Mercado Público - JA Chile

on:
  schedule:
    - cron: '0 12 * * 1' # Ejecuta 1 vez a la semana (los lunes a las 12:00 UTC / 09:00 AM Chile)
  workflow_dispatch: # Permite ejecutarlo manualmente con un clic desde GitHub

permissions:
  contents: write # Necesario para guardar el historial SQLite en el repo

jobs:
  ejecutar-agente:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerías necesarias
        run: |
          python -m pip install --upgrade pip
          pip install requests google-genai

      - name: Ejecutar mmp.py
        env:
          TICKET_MERCADO_PUBLICO: ${{ secrets.TICKET_MERCADO_PUBLICO }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
        run: |
          SCRIPT_PATH=$(find . -name "mmp.py" | head -n 1)
          if [ -z "$SCRIPT_PATH" ]; then
            echo "❌ ERROR: No se encontró mmp.py en el repositorio. Archivos actuales:"
            ls -la
            exit 1
          fi
          echo "✅ Ejecutando: $SCRIPT_PATH"
          python "$SCRIPT_PATH"

      - name: Guardar base de datos SQLite actualizada
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/historial_licitaciones.db
          git commit -m "Actualiza historial SQLite de licitaciones" || exit 0
          git push
